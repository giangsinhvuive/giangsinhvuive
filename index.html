<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Christmas Tree 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 35%, #0c162b 0%, #060913 65%, #03050a 100%);
      color: #e6f1ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    .greeting {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 18px rgba(255, 215, 120, 0.45);
      width: min(92vw, 900px);
    }
    .greeting h1 {
      font-size: clamp(18px, 3.2vw, 32px);
      letter-spacing: 3px;
      color: #ffe8a3;
      min-height: 1.3em;
    }
    .greeting p {
      margin-top: 6px;
      font-size: 12px;
      color: #9fb3d9;
    }

    /* Hiệu ứng mở thẻ lời chúc mượt mà & chỉnh chu */
    .gift-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 14, 0);
      backdrop-filter: blur(0px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 18px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  backdrop-filter 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  background 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0.28s linear;
    }
    .gift-modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      background: rgba(3, 6, 14, 0.62);
      backdrop-filter: blur(6px);
    }

    .gift-card {
      position: relative;
      width: min(92vw, 450px);
      background: linear-gradient(165deg, rgba(18, 30, 58, 0.96) 0%, rgba(10, 17, 34, 0.97) 100%);
      border: 1px solid rgba(255, 224, 130, 0.38);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 0 42px rgba(255, 209, 102, 0.16),
        0 20px 50px rgba(0, 0, 0, 0.65);
      border-radius: 16px;
      padding: 26px 26px 22px;
      color: #f4f8ff;
      text-align: center;
      transform: translateY(18px) scale(0.92);
      opacity: 0;
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.25s ease;
    }
    .gift-modal.open .gift-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .gift-ribbon-top {
      width: 54px;
      height: 4px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: var(--accent, #ffd166);
      box-shadow: 0 0 14px var(--accent, #ffd166);
    }

    .gift-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--accent, #ffd166);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      margin-bottom: 16px;
    }

    .gift-body {
      font-size: clamp(15px, 2.2vw, 17px);
      line-height: 1.72;
      color: #f8fbff;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-line;
      letter-spacing: 0.3px;
      padding: 4px 6px;
    }

    .gift-divider {
      height: 1px;
      width: 100%;
      margin: 18px 0 14px;
      background: linear-gradient(90deg, transparent, rgba(255, 232, 163, 0.25), transparent);
    }

    .gift-close {
      background: rgba(255, 255, 255, 0.06);
      color: #ffe8a3;
      border: 1px solid rgba(255, 224, 130, 0.35);
      border-radius: 10px;
      padding: 8px 20px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.18s ease, border-color 0.18s ease;
    }
    .gift-close:hover {
      background: rgba(255, 224, 130, 0.16);
      border-color: rgba(255, 224, 130, 0.65);
      transform: translateY(-1px);
    }
    .gift-close:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <audio id="bgMusic" src="music.mp3" loop preload="auto" crossorigin="anonymous"></audio>
  <canvas id="scene"></canvas>

  <div class="greeting">
    <h1 id="msgText"></h1>
    <p id="subText"></p>
  </div>

  <div id="giftModal" class="gift-modal" role="dialog" aria-modal="true" aria-labelledby="giftTag">
    <div id="giftCard" class="gift-card">
      <div id="giftRibbonTop" class="gift-ribbon-top"></div>
      <div id="giftTag" class="gift-tag"></div>
      <div id="giftBody" class="gift-body"></div>
      <div class="gift-divider"></div>
      <button id="giftClose" class="gift-close" type="button">Đóng lời chúc</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const customMsg = (params.get("msg") || "MERRY CHRISTMAS 2026").toUpperCase();
    const customAuthor = params.get("by") || "";

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const msgEl = document.getElementById("msgText");
    const subEl = document.getElementById("subText");
    if (customAuthor) subEl.textContent = customAuthor;

    // --- Nhạc nền + Phân tích nhịp nhạc ---
    const bgMusic = document.getElementById("bgMusic");
    let musicStarted = false;
    let analyser = null;
    let freqData = null;
    let audioEnergy = 0;

    function setupAnalyser() {
      if (analyser) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const aCtx = new AudioCtx();
        const src = aCtx.createMediaElementSource(bgMusic);
        analyser = aCtx.createAnalyser();
        analyser.fftSize = 128;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        src.connect(analyser);
        analyser.connect(aCtx.destination);
      } catch (_) {}
    }

    async function startMusic() {
      if (!musicStarted) {
        try {
          await bgMusic.play();
          musicStarted = true;
          setupAnalyser();
        } catch (_) {}
      }
    }

    startMusic();
    ["pointerdown", "keydown", "touchstart"].forEach((evt) => {
      window.addEventListener(evt, startMusic, { passive: true });
    });

    function getAudioBeat() {
      if (!analyser || !freqData || bgMusic.paused) {
        audioEnergy *= 0.9;
        return audioEnergy;
      }
      analyser.getByteFrequencyData(freqData);
      let sum = 0;
      const n = Math.min(20, freqData.length);
      for (let i = 0; i < n; i++) sum += freqData[i];
      const norm = sum / (n * 255);
      audioEnergy = Math.max(norm, audioEnergy * 0.85);
      return audioEnergy;
    }

    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // --- 1. Tán cây thông 3D ASCII + Đèn + Châu + Tuyết bám đầu cành ---
    const points = [];
    const tiers = 24;
    for (let t = 0; t < tiers; t++) {
      const yNorm = t / (tiers - 1);
      const y = -2.2 + yNorm * 4.4;
      const maxR = 0.12 + yNorm * 1.88;
      const count = Math.floor(30 + yNorm * 115);
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + t * 0.65;
        const rFrac = Math.pow(Math.random(), 0.55);
        const r = maxR * rFrac;
        const droop = Math.pow(rFrac, 1.5) * 0.25;
        const isTip = rFrac > 0.85;
        const isSnow = isTip && Math.random() < 0.45;
        const isLight = isTip && Math.random() < 0.15;
        const isOrnament = !isLight && Math.random() < 0.038;

        let char = "*";
        let color = "#2ea858";
        let glow = false;

        if (rFrac < 0.35) {
          char = ".";
          color = "#124927";
        } else if (isSnow) {
          char = "+";
          color = "#eef8ff";
        }

        if (isLight) {
          const palette = ["#ff595e", "#ffca3a", "#6ee7ff", "#ff8fab", "#a8ff78"];
          char = "o";
          color = palette[(t + i) % palette.length];
          glow = true;
        } else if (isOrnament) {
          const balls = ["#ff3b30", "#ffd60a", "#f1f5f9", "#38bdf8"];
          char = "@";
          color = balls[(t * 3 + i) % balls.length];
          glow = true;
        }

        points.push({
          x: Math.cos(angle) * r,
          y: y + droop,
          z: Math.sin(angle) * r,
          char,
          color,
          glow,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    // --- 2. Dải kim tuyến xoắn ốc ---
    const tinselCount = 260;
    const turns = 3.8;
    for (let i = 0; i < tinselCount; i++) {
      const u = i / (tinselCount - 1);
      const y = -2.1 + u * 4.25;
      const r = (0.16 + u * 1.92) * 1.03;
      const theta = u * Math.PI * 2 * turns;
      points.push({
        x: Math.cos(theta) * r,
        y,
        z: Math.sin(theta) * r,
        char: "~",
        color: i % 2 === 0 ? "#ffd166" : "#fff3b0",
        glow: true,
        phase: i * 0.25
      });
    }

    // --- 3. Thân cây có vân vỏ ---
    for (let i = 0; i < 110; i++) {
      const y = 2.2 + Math.random() * 0.75;
      const angle = Math.random() * Math.PI * 2;
      const r = 0.28 * Math.sqrt(Math.random());
      points.push({
        x: Math.cos(angle) * r,
        y,
        z: Math.sin(angle) * r,
        char: i % 3 === 0 ? "#" : "|",
        color: i % 3 === 0 ? "#6f3e19" : "#9c5e2b",
        glow: false,
        phase: Math.random() * Math.PI * 2
      });
    }

    // --- 4. Hộp quà 3D ASCII quanh chân cây + 6 lời chúc ---
    const gifts = [
      {
        id: 0,
        label: "món quà siu to siu khổng lồ 1",
        baseAngle: 0.2,
        orbitR: 2.15,
        size: 0.42,
        y: 2.75,
        boxColor: "#ef4444",
        ribbonColor: "#fde047",
        message: "chúc em bé ăn mau chóng lớn"
      },
      {
        id: 1,
        label: "món quà siu to siu khổng lồ 2",
        baseAngle: 1.25,
        orbitR: 2.35,
        size: 0.36,
        y: 2.78,
        boxColor: "#3b82f6",
        ribbonColor: "#f8fafc",
        message: "yeu lkhanhh"
      },
      {
        id: 2,
        label: "món quà siu to siu khổng lồ 3",
        baseAngle: 2.35,
        orbitR: 2.05,
        size: 0.45,
        y: 2.73,
        boxColor: "#10b981",
        ribbonColor: "#fcd34d",
        message: "lkhanh cuti s1 tg"
      },
      {
        id: 3,
        label: "món quà siu to siu khổng lồ 4",
        baseAngle: 3.45,
        orbitR: 2.30,
        size: 0.38,
        y: 2.77,
        boxColor: "#a855f7",
        ribbonColor: "#fde047",
        message: "chúc emm giáng sinh an lành"
      },
      {
        id: 4,
        label: "món quà siu to siu khổng lồ 5",
        baseAngle: 4.50,
        orbitR: 2.10,
        size: 0.40,
        y: 2.76,
        boxColor: "#f97316",
        ribbonColor: "#fef08a",
        message: "nếu sau này em có buồn thì có a ở đây roii"
      },
      {
        id: 5,
        label: "món quà siu to siu khổng lồ 6",
        baseAngle: 5.50,
        orbitR: 2.28,
        size: 0.35,
        y: 2.79,
        boxColor: "#ec4899",
        ribbonColor: "#e0f2fe",
        message: "HT chúc hai bạn hạnh phúc nha"
      }
    ];

    const giftHitboxes = [];
    const sparkles = [];
    let openAnim = { giftId: -1, progress: 0 }; // >0 khi hộp vừa được mở

    function spawnGiftSparkles(screenX, screenY, color) {
      for (let i = 0; i < 24; i++) {
        const ang = (i / 24) * Math.PI * 2 + Math.random() * 0.2;
        const spd = 45 + Math.random() * 110;
        sparkles.push({
          x: screenX,
          y: screenY,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 20,
          life: 1,
          decay: 1.15 + Math.random() * 0.7,
          color: i % 3 === 0 ? "#fff3b0" : color,
          char: i % 2 === 0 ? "+" : "*"
        });
      }
    }

    function buildGiftPoints(g, rotY, simTime) {
      const cx = Math.cos(rotY) * g.orbitR;
      const cz = Math.sin(rotY) * g.orbitR;
      const isOpening = openAnim.giftId === g.id && openAnim.progress > 0;
      const pop = isOpening ? Math.sin(openAnim.progress * Math.PI) : 0;
      const scaleMul = 1 + pop * 0.22;
      const h = g.size * 0.5 * scaleMul;

      const out = [];
      const steps = 4;
      for (let ix = -steps; ix <= steps; ix++) {
        for (let iy = -steps; iy <= steps; iy++) {
          for (let iz = -steps; iz <= steps; iz++) {
            const onSurface =
              Math.abs(ix) === steps || Math.abs(iy) === steps || Math.abs(iz) === steps;
            if (!onSurface) continue;

            const isTopLid = iy === steps;
            const lidLift = isTopLid ? -pop * 0.14 : 0;

            const lx = (ix / steps) * h;
            const ly = (iy / steps) * h + lidLift;
            const lz = (iz / steps) * h;

            const isRibbon =
              (Math.abs(ix) <= 1 && Math.abs(iy) === steps) ||
              (Math.abs(iz) <= 1 && Math.abs(iy) === steps) ||
              (Math.abs(ix) <= 1 && Math.abs(iz) === steps);

            const cosR = Math.cos(rotY * 1.4), sinR = Math.sin(rotY * 1.4);
            const rx = lx * cosR - lz * sinR;
            const rz = lx * sinR + lz * cosR;

            out.push({
              x: cx + rx,
              y: g.y + ly - pop * 0.05,
              z: cz + rz,
              char: isRibbon ? (isTopLid ? "+" : "#") : "%",
              color: isRibbon ? g.ribbonColor : g.boxColor,
              glow: isRibbon || pop > 0.05,
              phase: g.baseAngle + simTime * (pop > 0.05 ? 3 : 0),
              giftId: g.id
            });
          }
        }
      }
      return out;
    }

    // --- Modal lời chúc ---
    const giftModal = document.getElementById("giftModal");
    const giftCard = document.getElementById("giftCard");
    const giftRibbonTop = document.getElementById("giftRibbonTop");
    const giftTag = document.getElementById("giftTag");
    const giftBody = document.getElementById("giftBody");
    const giftClose = document.getElementById("giftClose");

    function openGiftModal(gift, clickX, clickY) {
      openAnim = { giftId: gift.id, progress: 1 };
      giftCard.style.setProperty("--accent", gift.ribbonColor);
      giftCard.style.borderColor = gift.ribbonColor + "88";
      giftRibbonTop.style.background = gift.ribbonColor;
      giftRibbonTop.style.boxShadow = `0 0 16px ${gift.ribbonColor}`;
      giftTag.textContent = gift.label;
      giftBody.textContent = gift.message;

      const hb = giftHitboxes.find((b) => b.giftId === gift.id);
      const sx = clickX ?? (hb ? (hb.minX + hb.maxX) * 0.5 : W * 0.5);
      const sy = clickY ?? (hb ? (hb.minY + hb.maxY) * 0.5 : H * 0.65);
      spawnGiftSparkles(sx, sy, gift.ribbonColor);

      requestAnimationFrame(() => {
        giftModal.classList.add("open");
      });
    }

    function closeGiftModal() {
      giftModal.classList.remove("open");
    }

    giftClose.addEventListener("click", closeGiftModal);
    giftModal.addEventListener("click", (e) => {
      if (e.target === giftModal) closeGiftModal();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeGiftModal();
    });

    // --- 5. Tuyết rơi & Sao trời ---
    const snow = Array.from({ length: 160 }, () => ({
      x: (Math.random() - 0.5) * 12,
      y: Math.random() * 8 - 4.2,
      z: (Math.random() - 0.5) * 12,
      speed: 0.45 + Math.random() * 1.0,
      drift: Math.random() * Math.PI * 2,
      char: Math.random() < 0.5 ? "*" : "."
    }));

    const stars = Array.from({ length: 110 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.78,
      r: 0.6 + Math.random() * 1.5,
      tw: Math.random() * Math.PI * 2
    }));

    // Tương tác xoay / zoom / bấm hộp quà
    let yaw = 0.4;
    let pitch = 0.14;
    let zoom = 6.5;
    let dragging = false;
    let movedDistance = 0;
    let lastX = 0, lastY = 0;

    function hitTestGift(px, py) {
      const candidates = giftHitboxes
        .filter((b) => px >= b.minX && px <= b.maxX && py >= b.minY && py <= b.maxY)
        .sort((a, b) => a.z - b.z);
      return candidates.length > 0 ? gifts.find((g) => g.id === candidates[0].giftId) : null;
    }

    canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      movedDistance = 0;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener("pointerup", (e) => {
      if (!dragging) return;
      dragging = false;
      if (movedDistance < 7) {
        const clickedGift = hitTestGift(e.clientX, e.clientY);
        if (clickedGift) openGiftModal(clickedGift, e.clientX, e.clientY);
      }
    });

    window.addEventListener("pointermove", (e) => {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      if (!dragging) {
        canvas.style.cursor = hitTestGift(e.clientX, e.clientY) ? "pointer" : "grab";
        return;
      }
      movedDistance += Math.hypot(dx, dy);
      if (movedDistance >= 5) canvas.style.cursor = "grabbing";
      yaw += dx * 0.008;
      pitch = Math.max(-0.55, Math.min(0.65, pitch + dy * 0.006));
      lastX = e.clientX;
      lastY = e.clientY;
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoom = Math.max(4.0, Math.min(11.0, zoom + e.deltaY * 0.003));
    }, { passive: false });

    let simTime = 0;
    let lastFrame = performance.now();

    function project(x, y, z) {
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      let x1 = x * cy - z * sy;
      let z1 = x * sy + z * cy;

      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      let y2 = y * cp - z1 * sp;
      let z2 = y * sp + z1 * cp;

      const dist = z2 + zoom;
      if (dist <= 0.2) return null;
      const fov = Math.min(W, H) * 0.78;
      const scale = fov / dist;
      return {
        sx: W * 0.5 + x1 * scale,
        sy: H * 0.47 + y2 * scale,
        z: z2,
        scale
      };
    }

    function drawGroundGrid() {
      const groundY = 2.98;
      const span = 5.5;
      const lines = 12;
      ctx.save();
      ctx.lineWidth = 1;
      for (let i = -lines; i <= lines; i++) {
        const offset = (i / lines) * span;
        const p1 = project(offset, groundY, -span);
        const p2 = project(offset, groundY, span);
        if (p1 && p2) {
          ctx.strokeStyle = "rgba(88, 138, 214, 0.14)";
          ctx.beginPath();
          ctx.moveTo(p1.sx, p1.sy);
          ctx.lineTo(p2.sx, p2.sy);
          ctx.stroke();
        }
        const p3 = project(-span, groundY, offset);
        const p4 = project(span, groundY, offset);
        if (p3 && p4) {
          ctx.strokeStyle = "rgba(88, 138, 214, 0.14)";
          ctx.beginPath();
          ctx.moveTo(p3.sx, p3.sy);
          ctx.lineTo(p4.sx, p4.sy);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function render(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      simTime += dt;
      yaw += dt * 0.42;
      const beat = getAudioBeat();

      if (openAnim.progress > 0) {
        openAnim.progress = Math.max(0, openAnim.progress - dt * 1.45);
      }

      const typedLen = Math.min(customMsg.length, Math.floor(simTime * 11));
      msgEl.textContent = customMsg.slice(0, typedLen) + (typedLen < customMsg.length ? "_" : "");

      ctx.clearRect(0, 0, W, H);

      for (const s of stars) {
        const alpha = 0.3 + 0.7 * Math.abs(Math.sin(simTime * 1.9 + s.tw));
        ctx.fillStyle = `rgba(225, 238, 255, ${alpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      drawGroundGrid();

      ctx.font = "13px monospace";
      ctx.fillStyle = "rgba(220, 238, 255, 0.75)";
      for (const fl of snow) {
        fl.y += fl.speed * dt;
        fl.x += Math.sin(simTime * 1.4 + fl.drift) * 0.28 * dt;
        if (fl.y > 3.6) {
          fl.y = -3.9;
          fl.x = (Math.random() - 0.5) * 12;
        }
        const p = project(fl.x, fl.y, fl.z);
        if (p) ctx.fillText(fl.char, p.sx, p.sy);
      }

      const allPoints = [...points];
      for (const g of gifts) {
        const rotAngle = g.baseAngle + simTime * 0.35;
        allPoints.push(...buildGiftPoints(g, rotAngle, simTime));
      }

      giftHitboxes.length = 0;
      const boxAcc = new Map();

      const projected = [];
      for (const pt of allPoints) {
        const p = project(pt.x, pt.y, pt.z);
        if (!p) continue;
        projected.push({ ...pt, ...p });

        if (pt.giftId !== undefined) {
          const pad = Math.max(14, p.scale * 0.042);
          let entry = boxAcc.get(pt.giftId);
          if (!entry) {
            entry = {
              giftId: pt.giftId,
              minX: p.sx - pad,
              maxX: p.sx + pad,
              minY: p.sy - pad,
              maxY: p.sy + pad,
              z: p.z
            };
            boxAcc.set(pt.giftId, entry);
          } else {
            entry.minX = Math.min(entry.minX, p.sx - pad);
            entry.maxX = Math.max(entry.maxX, p.sx + pad);
            entry.minY = Math.min(entry.minY, p.sy - pad);
            entry.maxY = Math.max(entry.maxY, p.sy + pad);
            entry.z = Math.min(entry.z, p.z);
          }
        }
      }
      for (const entry of boxAcc.values()) giftHitboxes.push(entry);

      projected.sort((a, b) => b.z - a.z);

      for (const item of projected) {
        const fontSize = Math.max(9, Math.min(22, item.scale * 0.036));
        ctx.font = `bold ${fontSize.toFixed(1)}px monospace`;
        if (item.glow) {
          const pulse = 0.65 + 0.35 * Math.sin(simTime * 5 + item.phase) + beat * 0.55;
          ctx.shadowColor = item.color;
          ctx.shadowBlur = Math.min(22, 10 * pulse);
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.fillStyle = item.color;
        ctx.fillText(item.char, item.sx, item.sy);
      }
      ctx.shadowBlur = 0;

      // Tia sáng lấp lánh bật ra khi bấm mở hộp quà
      if (sparkles.length > 0) {
        ctx.save();
        ctx.font = "bold 14px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let i = sparkles.length - 1; i >= 0; i--) {
          const sp = sparkles[i];
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.vy += 120 * dt;
          sp.life -= sp.decay * dt;
          if (sp.life <= 0) {
            sparkles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = Math.max(0, sp.life);
          ctx.shadowColor = sp.color;
          ctx.shadowBlur = 12;
          ctx.fillStyle = sp.color;
          ctx.fillText(sp.char, sp.x, sp.y);
        }
        ctx.restore();
      }

      // Ngôi sao đỉnh cây + 8 tia sáng tỏa ra
      const starProj = project(0, -2.45, 0);
      if (starProj) {
        const burst = Math.abs(Math.sin(simTime * 2.2)) > 0.94 || beat > 0.55;
        const sSize = Math.max(18, starProj.scale * (0.066 + beat * 0.015));
        const rayLen = sSize * (1.25 + 0.35 * Math.sin(simTime * 4) + beat * 0.6);

        ctx.save();
        ctx.translate(starProj.sx, starProj.sy);

        ctx.strokeStyle = burst ? "rgba(255,255,255,0.85)" : "rgba(255, 214, 102, 0.55)";
        ctx.lineWidth = 1.4;
        for (let r = 0; r < 8; r++) {
          const ang = simTime * 0.6 + (r * Math.PI) / 4;
          const len = r % 2 === 0 ? rayLen : rayLen * 0.68;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ang) * len, Math.sin(ang) * len);
          ctx.stroke();
        }

        ctx.rotate(simTime * 0.6);
        ctx.font = `bold ${sSize.toFixed(1)}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = burst ? "#ffffff" : "#ffd166";
        ctx.shadowBlur = burst ? 26 : 15;
        ctx.fillStyle = burst ? "#ffffff" : "#ffd166";
        ctx.fillText("★", 0, 0);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
